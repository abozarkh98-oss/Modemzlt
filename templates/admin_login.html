<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود مدیریت - ZLT X28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
        <h2 class="text-lg font-bold text-white text-center mb-6">ورود به پنل مدیریت ZLT X28</h2>
        
        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">نام کاربری ادمین</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">رمز عبور ادمین</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>
            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-semibold py-2.5 rounded-xl transition text-sm">ورود به پنل</button>
        </form>
        
        <div class="text-center mt-4">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-300">بازگشت به صفحه اصلی</a>
        </div>
    </div>
</body>
</html>
