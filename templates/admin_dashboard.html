<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت بسته‌ها - ZLT X28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen pb-24">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-sky-400 text-lg">پنل مدیریت ZLT X28</h1>
            <a href="/" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl">مشاهده سایت</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8 space-y-8">

        <!-- Live Server Status Grid (Every 1 Second) -->
        <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-slate-400">مصرف CPU (زنده)</span>
                    <span id="cpuVal" class="text-sm font-bold text-sky-400">0%</span>
                </div>
                <div class="w-full bg-slate-950 rounded-full h-3 overflow-hidden">
                    <div id="cpuBar" class="bg-sky-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-slate-400">مصرف RAM (زنده)</span>
                    <span id="ramVal" class="text-sm font-bold text-purple-400">0%</span>
                </div>
                <div class="w-full bg-slate-950 rounded-full h-3 overflow-hidden">
                    <div id="ramBar" class="bg-purple-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <!-- Manage Packages Section (Add / Edit / Delete) -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-white text-base">مدیریت بسته‌های اینترنت</h3>
                <button onclick="openAddPackageModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">
                    + افزودن بسته جدید
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="text-xs text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="py-3 px-2">دسته‌بندی</th>
                            <th class="py-3 px-2">عنوان بسته</th>
                            <th class="py-3 px-2">قیمت اصلی</th>
                            <th class="py-3 px-2">درصد تخفیف</th>
                            <th class="py-3 px-2 text-center">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="adminPackagesTable" class="divide-y divide-slate-800">
                        <!-- Dynamic Packages List -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Orders Management -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h3 class="font-bold text-white text-base mb-4">مدیریت سفارشات خرید</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="text-xs text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="py-3 px-2">نام</th>
                            <th class="py-3 px-2">تماس</th>
                            <th class="py-3 px-2">بسته</th>
                            <th class="py-3 px-2">قیمت پرداخت‌شده</th>
                            <th class="py-3 px-2">وضعیت</th>
                            <th class="py-3 px-2 text-center">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable" class="divide-y divide-slate-800">
                        <!-- Orders -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Announcement Sender -->
        <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
            <h3 class="font-bold text-white text-base mb-4">ارسال اطلاعیه همگانی زمان‌دار</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <input id="annText" type="text" placeholder="متن اطلاعیه..." class="sm:col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white">
                <input id="annHours" type="number" placeholder="مدت زمان (ساعت)" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white">
            </div>
            <button onclick="sendAnnouncement()" class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition">
                ثبت و ارسال اطلاعیه
            </button>
        </section>

    </main>

    <!-- Refresh Button -->
    <div class="fixed bottom-6 left-6 z-50">
        <button onclick="fetchStats()" class="bg-sky-500 hover:bg-sky-400 text-white p-3 rounded-2xl shadow-2xl flex items-center gap-2 text-xs font-bold transition">
            🔄 بروزرسانی
        </button>
    </div>

    <script>
        // Fetch Live System Stats (CPU / RAM) every 1s
        setInterval(async () => {
            const res = await fetch('/api/stats');
            const data = await res.json();
            document.getElementById('cpuVal').innerText = data.cpu + '%';
            document.getElementById('cpuBar').style.width = data.cpu + '%';
            document.getElementById('ramVal').innerText = data.ram + '%';
            document.getElementById('ramBar').style.width = data.ram + '%';
        }, 1000);

        // Load Admin Packages
        async function loadAdminPackages() {
            const res = await fetch('/api/packages');
            const packages = await res.json();
            const tbody = document.getElementById('adminPackagesTable');
            tbody.innerHTML = '';

            packages.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td class="py-3 px-2 text-cyan-400">${p.category}</td>
                        <td class="py-3 px-2 font-bold">${p.name}</td>
                        <td class="py-3 px-2">${p.price.toLocaleString()} تومان</td>
                        <td class="py-3 px-2 text-rose-400 font-bold">${p.discount}%</td>
                        <td class="py-3 px-2 text-center space-x-1 space-x-reverse">
                            <button onclick="openEditPackageModal(${p.id}, '${p.name}', '${p.category}', ${p.price}, ${p.discount})" class="bg-amber-600 hover:bg-amber-500 text-white px-2.5 py-1 rounded-lg text-xs">ویرایش</button>
                            <button onclick="deletePackage(${p.id})" class="bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded-lg text-xs">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function openAddPackageModal() {
            Swal.fire({
                title: 'افزودن بسته جدید',
                html: `
                    <input id="pkg-name" class="swal2-input text-right text-sm" placeholder="نام بسته (مثلا: یکروزه ۵ گیگ)">
                    <select id="pkg-cat" class="swal2-input text-right text-sm">
                        <option value="یکروزه">یکروزه</option>
                        <option value="هفتگی">هفتگی</option>
                        <option value="ماهانه">ماهانه</option>
                    </select>
                    <input id="pkg-price" type="number" class="swal2-input text-right text-sm" placeholder="قیمت (تومان)">
                    <input id="pkg-discount" type="number" class="swal2-input text-right text-sm" placeholder="درصد تخفیف (مثلاً ۱۰)">
                `,
                showCancelButton: true,
                confirmButtonText: 'افزودن',
                preConfirm: () => {
                    return {
                        name: document.getElementById('pkg-name').value,
                        category: document.getElementById('pkg-cat').value,
                        price: document.getElementById('pkg-price').value,
                        discount: document.getElementById('pkg-discount').value || 0
                    }
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch('/api/packages/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(result.value)
                    });
                    loadAdminPackages();
                }
            });
        }

        function openEditPackageModal(id, name, cat, price, discount) {
            Swal.fire({
                title: 'ویرایش بسته',
                html: `
                    <input id="pkg-name" class="swal2-input text-right text-sm" value="${name}">
                    <select id="pkg-cat" class="swal2-input text-right text-sm">
                        <option value="یکروزه" ${cat==='یکروزه'?'selected':''}>یکروزه</option>
                        <option value="هفتگی" ${cat==='هفتگی'?'selected':''}>هفتگی</option>
                        <option value="ماهانه" ${cat==='ماهانه'?'selected':''}>ماهانه</option>
                    </select>
                    <input id="pkg-price" type="number" class="swal2-input text-right text-sm" value="${price}">
                    <input id="pkg-discount" type="number" class="swal2-input text-right text-sm" value="${discount}">
                `,
                showCancelButton: true,
                confirmButtonText: 'ذخیره تغییرات',
                preConfirm: () => {
                    return {
                        id: id,
                        name: document.getElementById('pkg-name').value,
                        category: document.getElementById('pkg-cat').value,
                        price: document.getElementById('pkg-price').value,
                        discount: document.getElementById('pkg-discount').value
                    }
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch('/api/packages/edit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(result.value)
                    });
                    loadAdminPackages();
                }
            });
        }

        async function deletePackage(id) {
            if (confirm('آیا از حذف این بسته اطمینان دارید؟')) {
                await fetch('/api/packages/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                loadAdminPackages();
            }
        }

        // Orders List
        async function loadOrders() {
            const res = await fetch('/api/orders');
            const orders = await res.json();
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = '';

            orders.forEach(o => {
                let statusBadge = o.status === 'approved' 
                    ? '<span class="text-emerald-400 bg-emerald-950/60 px-2 py-1 rounded-md text-xs">تایید شده</span>' 
                    : o.status === 'rejected' 
                    ? '<span class="text-rose-400 bg-rose-950/60 px-2 py-1 rounded-md text-xs">رد شده</span>'
                    : '<span class="text-amber-400 bg-amber-950/60 px-2 py-1 rounded-md text-xs">در انتظار</span>';

                tbody.innerHTML += `
                    <tr>
                        <td class="py-3 px-2">${o.username}</td>
                        <td class="py-3 px-2">${o.phone}</td>
                        <td class="py-3 px-2">${o.package}</td>
                        <td class="py-3 px-2 text-amber-400 font-bold">${Math.round(o.price).toLocaleString()} تومان</td>
                        <td class="py-3 px-2">${statusBadge}</td>
                        <td class="py-3 px-2 text-center space-x-1 space-x-reverse">
                            <button onclick="updateOrderStatus(${o.id}, 'approved')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg text-xs">تایید</button>
                            <button onclick="updateOrderStatus(${o.id}, 'rejected')" class="bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded-lg text-xs">رد</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function updateOrderStatus(id, status) {
            await fetch('/api/order/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, status: status })
            });
            loadOrders();
        }

        async function sendAnnouncement() {
            const text = document.getElementById('annText').value;
            const hours = document.getElementById('annHours').value;
            if (!text || !hours) return alert('فیلدها را پر کنید');

            await fetch('/api/announcement', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, hours: hours })
            });

            Swal.fire({ icon: 'success', title: 'ارسال شد' });
        }

        loadAdminPackages();
        loadOrders();
    </script>
</body>
</html>
