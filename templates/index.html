<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خرید بسته - ZLT X28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #080c14; color: #f3f4f6; }
        
        @keyframes rgb-rotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .rgb-card {
            position: relative;
            background: #0f172a;
            border-radius: 1.25rem;
            z-index: 1;
        }

        .rgb-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff0055, #7600ff, #00d4ff, #00ff66, #ff0055);
            background-size: 400% 400%;
            border-radius: 1.35rem;
            z-index: -1;
            animation: rgb-rotate 4s linear infinite;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .rgb-card:hover::before {
            opacity: 1;
            filter: blur(4px);
        }

        .rgb-btn {
            background: linear-gradient(90deg, #ff0055, #7600ff, #00d4ff);
            background-size: 200% 200%;
            animation: rgb-rotate 3s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-lg font-bold text-cyan-400">سامانه شارژ مودم ZLT X28</h1>
            <a href="/admin/dashboard" class="text-xs bg-slate-800 text-slate-300 px-3 py-2 rounded-xl">پنل مدیریت</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8 space-y-10">

        <!-- Announcement Alert -->
        <div id="announcementBox" class="hidden animate__animated animate__bounceIn">
            <div class="bg-indigo-950/80 border border-indigo-500/50 rounded-2xl p-4 flex items-center gap-4">
                <span class="text-2xl animate-bounce">📢</span>
                <div>
                    <h4 class="font-bold text-indigo-300 text-sm">اطلاعیه مهم</h4>
                    <p id="announcementText" class="text-xs text-slate-300"></p>
                </div>
            </div>
        </div>

        <section class="text-center space-y-2">
            <h2 class="text-2xl sm:text-3xl font-black">انتخاب و خرید آنلاین بسته</h2>
            <p class="text-xs text-slate-400">بسته مورد نظر خود را انتخاب کرده و سفارش را ثبت کنید.</p>
        </section>

        <!-- Packages Grid -->
        <div id="packagesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- بسته‌ها به صورت دینامیک اضافه می‌شوند -->
        </div>

    </main>

    <script>
        async function loadPackages() {
            const res = await fetch('/api/packages');
            const packages = await res.json();
            const container = document.getElementById('packagesContainer');
            container.innerHTML = '';

            packages.forEach(p => {
                let finalPrice = p.price;
                let discountBadge = '';
                let originalPriceHtml = '';

                if (p.discount > 0) {
                    finalPrice = p.price * (1 - p.discount / 100);
                    discountBadge = `<span class="text-xs text-rose-400 bg-rose-950/80 border border-rose-800 px-2 py-0.5 rounded-full font-bold">${p.discount}% تخفیف</span>`;
                    originalPriceHtml = `<span class="text-xs text-slate-500 line-through mr-2">${p.price.toLocaleString()}</span>`;
                }

                container.innerHTML += `
                    <div class="rgb-card p-6 flex flex-col justify-between animate__animated animate__zoomIn">
                        <div>
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-cyan-400 bg-cyan-950/60 border border-cyan-800 px-2.5 py-1 rounded-full">${p.category}</span>
                                ${discountBadge}
                            </div>
                            <h3 class="text-lg font-bold text-white mt-3">${p.name}</h3>
                            <div class="mt-4 flex items-baseline">
                                ${originalPriceHtml}
                                <span class="text-2xl font-black text-amber-400">${Math.round(finalPrice).toLocaleString()}</span>
                                <span class="text-xs text-slate-400 font-normal mr-1">تومان</span>
                            </div>
                        </div>
                        <button onclick="openOrderModal('${p.name}', '${finalPrice}')" class="rgb-btn text-white font-bold py-3 rounded-xl mt-6 text-sm hover:scale-105 transition">
                            سفارش بسته
                        </button>
                    </div>
                `;
            });
        }

        async function fetchAnnouncement() {
            try {
                const res = await fetch('/api/announcement');
                const data = await res.json();
                if (data.active && data.text) {
                    document.getElementById('announcementText').innerText = data.text;
                    document.getElementById('announcementBox').classList.remove('hidden');
                }
            } catch (err) {}
        }

        function openOrderModal(packageName, price) {
            Swal.fire({
                title: 'تایید و ثبت سفارش',
                html: `
                    <p class="text-sm text-slate-300 mb-2">خرید <b>${packageName}</b></p>
                    <p class="text-sm text-amber-400 font-bold mb-4">مبلغ: ${parseInt(price).toLocaleString()} تومان</p>
                    <input id="swal-user" class="swal2-input text-right text-sm" placeholder="نام و نام خانوادگی">
                    <input id="swal-phone" class="swal2-input text-right text-sm" placeholder="شماره موبایل یا شناسه مودم">
                `,
                showCancelButton: true,
                confirmButtonText: 'ثبت سفارش خرید',
                cancelButtonText: 'انصراف',
                confirmButtonColor: '#00d4ff',
                preConfirm: () => {
                    const user = document.getElementById('swal-user').value;
                    const phone = document.getElementById('swal-phone').value;
                    if (!user || !phone) Swal.showValidationMessage('لطفا تمام فیلدها را پر کنید');
                    return { username: user, phone: phone, package: packageName, price: price }
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const response = await fetch('/api/order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(result.value)
                    });
                    const resData = await response.json();
                    if (resData.success) {
                        Swal.fire({ icon: 'success', title: 'سفارش ثبت شد', confirmButtonColor: '#10b981' });
                    }
                }
            });
        }

        loadPackages();
        fetchAnnouncement();
    </script>
</body>
</html>
